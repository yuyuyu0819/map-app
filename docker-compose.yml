services:
  backend:
    build:
      context: ./backend-tooling
      args:
        GRAILS_VERSION: "7.0.4"
    volumes:
      - ./:/work
      - gradle_cache:/root/.gradle
    ports:
      - "8080:8080"
    # ヘルスチェック（backend-tooling に curl が入っている前提）
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
  gradle_cache:
